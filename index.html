<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182b48"><meta name="mobile-web-app-capable" content="yes"><title>ドラム風おしゃべりボイス</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>body{margin:0;background:#edf2f8;font-family:system-ui,sans-serif;color:#16253a}main{max-width:520px;margin:auto;padding:18px}header{text-align:center;background:#182b48;color:white;border-radius:20px;padding:20px}h1{font-size:23px;margin:8px}section{background:white;border-radius:18px;padding:16px;margin-top:15px;box-shadow:0 2px 9px #0001}textarea,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #b6c4d5;border-radius:10px}textarea{min-height:130px}button{font:inherit;border:0;border-radius:11px;padding:13px;cursor:pointer}button.primary{background:#2457b7;color:white;font-weight:bold}button.secondary{background:#e6edf8;color:#172e51}.actions,.phrases{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.phrases button{font-size:14px}label{display:block;margin:12px 0 6px}input[type=range]{width:100%}.muted{color:#526477;font-size:13px}#status{text-align:center;min-height:22px;margin-top:10px}footer{text-align:center;font-size:12px;color:#60718a;padding:20px}</style></head><body><main><header><div style="font-size:42px">🥁</div><h1>ドラム風おしゃべりボイス</h1><div>文字を声にして伝えよう！</div></header><section><label for="message"><b>話したい言葉</b></label><textarea id="message">こんにちは！私はドラムです。よろしくね！</textarea><div class="actions"><button class="primary" id="speak">▶ 読み上げる</button><button class="secondary" id="stop">■ 停止</button></div><div id="status" class="muted" role="status">準備完了</div></section><section><b>よく使う言葉</b><div id="phrases" class="phrases"></div></section><section><b>声の設定</b><label for="preset">声の雰囲気</label><select id="preset"><option value="cute">元気でかわいい声</option><option value="soft">やさしい声</option><option value="normal">標準の声</option></select><label for="lang">言語</label><select id="lang"><option value="ja-JP">日本語</option><option value="en-US">英語</option></select><label for="voice">音声</label><select id="voice"><option value="auto">自動選択（女性音声を優先）</option></select><div id="voiceInfo" class="muted" aria-live="polite"></div><label for="rate">読み上げ速度：<output id="rateVal">1.0倍</output></label><input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1.13"><label for="pitch">声の高さ：<output id="pitchVal">1.2</output></label><input id="pitch" type="range" min="0.7" max="1.8" step="0.1" value="1.35"></section><footer>非公式ファン向け音声アプリ。ドラマ出演者の声は使用していません。<br>音声の種類とオフライン利用可否は端末・ブラウザによって異なります。</footer></main><script src="app.js?v=2"></script></body></html>
